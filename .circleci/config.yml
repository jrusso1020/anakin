---
version: 2.1
orbs:
  aws-s3: circleci/aws-s3@4.1.0
commands:
  install_pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            export PNPM_HOME="$HOME/.local/share/pnpm"
            curl -fsSL https://get.pnpm.io/install.sh -o /tmp/install-pnpm.sh
            env PNPM_VERSION=11.22.0 PNPM_HOME="$PNPM_HOME" SHELL=/bin/bash sh /tmp/install-pnpm.sh
            echo 'export PNPM_HOME="$HOME/.local/share/pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"' >> "$BASH_ENV"
            export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
            pnpm --version
jobs:
  dependencies:
    docker:
      - image: cimg/node:22.13.1-browsers
    working_directory: ~/anakin
    steps:
      - checkout
      - install_pnpm
      - restore_cache:
          keys:
            - pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-packages-v1-{{ .Branch }}
            - pnpm-packages-v1
      - run:
          name: Install Puppeteer Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libgbm1
      - run:
          name: Install Dependencies
          command: |
            pnpm install --frozen-lockfile
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - save_cache:
          key: v1-repo-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/anakin
  format:
    docker:
      - image: cimg/node:22.13.1
    working_directory: ~/anakin
    steps:
      - install_pnpm
      - restore_cache:
          key: v1-repo-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
      - restore_cache:
          key: pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Format
          command: |
            pnpm format:check
  lint:
    docker:
      - image: cimg/node:22.13.1
    working_directory: ~/anakin
    steps:
      - install_pnpm
      - restore_cache:
          key: v1-repo-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
      - restore_cache:
          key: pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Lint
          command: |
            pnpm lint:check
  type-check:
    docker:
      - image: cimg/node:22.13.1
    working_directory: ~/anakin
    steps:
      - install_pnpm
      - restore_cache:
          key: v1-repo-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
      - restore_cache:
          key: pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Type Check
          command: |
            pnpm type-check
  build:
    docker:
      - image: cimg/node:22.13.1-browsers
    working_directory: ~/anakin
    resource_class: large
    steps:
      - checkout
      - install_pnpm
      - restore_cache:
          keys:
            - pnpm-packages-v1-{{ .Branch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-packages-v1-{{ .Branch }}
            - pnpm-packages-v1
      - run:
          name: Install Puppeteer Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libgbm1
      - run:
          name: Install Dependencies
          command: |
            pnpm install --frozen-lockfile
      - run:
          name: Build
          command: |
            pnpm build
      - persist_to_workspace:
          root: .
          paths:
            - .
  deploy:
    docker:
      - image: cimg/node:22.13.1
    working_directory: ~/anakin
    steps:
      - attach_workspace:
          at: .
      - aws-s3/sync:
          from: public
          to: "s3://boredhacking.com"
          arguments: >-
            --delete
            --cache-control "public, max-age=0, must-revalidate"
      - aws-s3/copy:
          from: public
          to: "s3://boredhacking.com"
          arguments: >-
            --recursive
            --exclude "*"
            --include "*.js"
            --include "*.css"
            --include "static/*"
            --cache-control "public, max-age=31536000, immutable"
workflows:
  version: 2.1
  build_and_deploy:
    jobs:
      - dependencies
      - format:
          requires:
            - dependencies
      - type-check:
          requires:
            - dependencies
      - lint:
          requires:
            - dependencies
      - build
      - deploy:
          requires:
            - build
            - format
            - lint
            - type-check
          filters:
            branches:
              only:
                - main
